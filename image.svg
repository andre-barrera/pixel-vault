<!-- Moon Logo (Cyberpunk Style) -->
<svg xmlns="http://w3.org" viewBox="0 0 100 100" width="100" height="100">
  <!-- Deep Space Canvas -->
  <rect width="100" height="100" rx="15" fill="#0F0C24"/>
  
  <!-- Cyberpunk Crescent Moon Matrix -->
  <path d="M 65,25 A 28,28 0 1,0 65,81 A 24,24 0 1,1 65,25 Z" fill="#00F3FF"/>
  
  <!-- Digital Segment Cuts -->
  <path d="M 20,40 L 80,40 M 20,52 L 80,52 M 20,64 L 80,64" stroke="#0F0C24" stroke-width="2.5"/>
  
  <!-- Neon Plasma Clouds -->
  <path d="M 15,75 Q 35,65 55,73 T 90,70" fill="none" stroke="#E61C5D" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 10,83 Q 40,78 60,85 T 85,78" fill="none" stroke="#FF003C" stroke-width="2" stroke-linecap="round"/>
</svg>
